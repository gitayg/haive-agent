[package]
name = "it-ai-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "it-ai"
path = "src/main.rs"

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Pure-Rust X11 (XTEST) backend instead of the default `xdo` feature, which
# hard-links libxdo.so.3 and makes the binary fail to load on a bare Ubuntu
# server that lacks libxdo3. x11rb needs no shared lib at load time; input
# still works over $DISPLAY, and Enigo::new() degrades gracefully when headless.
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
rcgen = "0.13"
sha2 = "0.10"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
ed25519-dalek = "2"
sysinfo = "0.33"
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
self-replace = "1"
portable-pty = "0.8"

# setsid() when backgrounding, so the detached agent survives the terminal/SSH
# closing (the Unix analog of the Windows job-breakaway below).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# cpal (microphone enumeration) links the platform audio lib: WASAPI/CoreAudio on
# Windows/macOS (fine), but ALSA's libasound.so.2 on Linux — a hard load-time
# dependency that makes the binary fail to even start on minimal hosts (WSL,
# containers, headless servers) that lack the ALSA runtime. So cpal is non-Linux
# only; Linux enumerates mics from the kernel's /proc/asound interface instead,
# which needs no userspace lib. Same reasoning as the enigo/libxdo note above.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Native security-posture probes (winprobe.rs): WMI queries for AV/BitLocker/
# firewall/services instead of shelling out to PowerShell/manage-bde/netsh.
# default-features=false drops the unused chrono datetime deserializer (CIM
# datetimes are parsed as plain strings; no probe deserializes into chrono).
# Pulls the compile-time `windows` bindings crate transitively.
wmi = { version = "0.14", default-features = false }
# Tray icon + embedded chat window (Phase 2). Windows-only for now — the Linux
# webview (webkit2gtk) would drag a heavy system lib into the zigbuild, and macOS
# can follow. Best-effort: if the GUI can't init (Session 0 service, no desktop),
# the tray thread just exits and the agent keeps running headless.
tray-icon = "0.19"
tao = "0.30"
wry = "0.45"
# Session 0 isolation: a SYSTEM service can't reach the interactive desktop, so
# screen capture is delegated to a one-shot run inside the active user's session.
# The WTS/token APIs address that session by ID — no username involved — which is
# what makes it work on Azure AD / Microsoft-account boxes where schtasks /RU
# can't resolve a name to a SID.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_Environment",
    # winprobe.rs: GetDriveTypeW (fixed-volume filter for the BitLocker probe)
    "Win32_Storage_FileSystem",
    # winprobe.rs: SHEmptyRecycleBinW + SHERB_* flags (empty-Recycle-Bin fix)
    "Win32_UI_Shell",
] }
# winbootstrap.rs (native winget bootstrap via the WinRT AppX PackageManager) +
# winupdate.rs (native OS-update check/install via the Windows Update Agent COM
# API). Pinned to 0.59 to match the `windows` bindings `wmi` already pulls in
# (avoids a second copy in the tree).
windows = { version = "0.59", features = [
    "Management_Deployment",
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_UpdateAgent",
] }

# Wayland screen capture on GNOME/KDE (no wlr-screencopy): the xdg-desktop-portal
# ScreenCast API (D-Bus, via zbus blocking) hands us a PipeWire fd + node, which
# the pipewire crate streams one frame from. zbus + pipewire are already in the
# tree (transitive), so this adds no new system libs beyond libpipewire — which
# every Wayland desktop already ships.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
pipewire = "0.9"
