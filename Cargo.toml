[workspace]
resolver = "2"
members = ["crates/agent", "crates/cap", "crates/cli", "crates/direct", "crates/mcp"]
exclude = ["vendor/boringtun"]

[workspace.package]
version = "3.9.0"
edition = "2021"
license = "MIT"

# boringtun 0.7.1, vendored exactly as published on crates.io (the .crate's sha256 is the
# checksum Cargo.lock held for it), so it can carry a patch.
[patch.crates-io]
boringtun = { path = "vendor/boringtun" }
