[workspace]
resolver = "2"
members = ["crates/agent", "crates/cap", "crates/cli", "crates/direct", "crates/mcp"]
exclude = ["vendor/boringtun"]

[workspace.package]
version = "3.9.0"
edition = "2021"
license = "MIT"

# boringtun 0.7.1 as published, plus one patch (vendor/boringtun/src/device/mod.rs, marked
# "IT-AI patch"): a kernel without IPv6 (ipv6.disable=1) refuses AF_INET6 sockets, and 0.7.1
# then fails to create the device at all. Patched, it listens on IPv4 alone.
[patch.crates-io]
boringtun = { path = "vendor/boringtun" }
