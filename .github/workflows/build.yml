name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write        # OIDC — mint the Sigstore identity for provenance
  attestations: write    # store the signed build-provenance attestations

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows
            ext: ".exe"
          - os: macos-latest
            suffix: macos
            ext: ""
          # Linux builds run on 24.04 (its PipeWire/SPA headers are new enough for
          # the libspa crate) but link an OLD glibc via cargo-zigbuild, so the
          # binaries also run on Debian 12 / Ubuntu 22.04 and ARM SBCs (Radxa).
          - os: ubuntu-24.04
            suffix: linux
            ext: ""
            triple: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            suffix: linux-arm64
            ext: ""
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    # No signing secrets here — this public repo only BUILDS + ATTESTS + publishes
    # UNSIGNED binaries. Authenticode/Developer-ID signing happens in the private
    # gitayg/HaiveControl repo (sign-release.yml), which downloads these binaries,
    # signs them with the cert (kept private), and re-uploads the signed versions.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Linux capture/input build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: >
          sudo apt-get update && sudo apt-get install -y
          libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev
          libx11-dev libxtst-dev libdbus-1-dev pkg-config
          libwayland-dev libxkbcommon-dev
          libpipewire-0.3-dev libclang-dev
          libasound2-dev
          libegl-dev libgl-dev libgles-dev libgbm-dev libdrm-dev

      - name: Install zig + cargo-zigbuild (Linux — link an older glibc)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          pip3 install "ziglang==0.13.0"
          cargo install --locked cargo-zigbuild
          rustup target add ${{ matrix.triple }}

      - name: Build all binaries (Linux, glibc 2.31 floor)
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo zigbuild --release --target ${{ matrix.triple }}.2.31

      - name: Build all binaries (macOS / Windows)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: cargo build --release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir out
          dir="target/release"
          if [ -n "${{ matrix.triple }}" ]; then dir="target/${{ matrix.triple }}/release"; fi
          for b in it-ai itai it-ai-mcp; do
            cp "${dir}/${b}${{ matrix.ext }}" "out/${b}-${{ matrix.suffix }}${{ matrix.ext }}"
          done

      # A .deb so `apt install ./it-ai-linux.deb` pulls the agent's runtime libs
      # automatically (the screen-capture stack: libgbm/libwayland/libpipewire/
      # libxcb) instead of failing at load with "cannot open shared object file"
      # on a box that lacks them. Depends mirror the binary's ELF NEEDED entries.
      - name: Package .deb (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          dir="target/${{ matrix.triple }}/release"
          arch="amd64"; [ "${{ matrix.suffix }}" = "linux-arm64" ] && arch="arm64"
          ver="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          root="debpkg"
          mkdir -p "$root/DEBIAN" "$root/usr/bin"
          cp "${dir}/it-ai" "$root/usr/bin/it-ai"
          chmod 755 "$root/usr/bin/it-ai"
          {
            echo "Package: it-ai"
            echo "Version: ${ver}"
            echo "Architecture: ${arch}"
            echo "Maintainer: gitayg <gitayg@gmail.com>"
            echo "Depends: libc6, libgbm1, libwayland-client0, libpipewire-0.3-0, libxcb1"
            echo "Section: admin"
            echo "Priority: optional"
            echo "Homepage: https://github.com/gitayg/haive-agent"
            echo "Description: IT-AI endpoint agent"
            echo " Self-hosted, LAN-first + reverse-tunnel remote administration agent."
          } > "$root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$root" "out/it-ai-${{ matrix.suffix }}.deb"
          dpkg-deb -I "out/it-ai-${{ matrix.suffix }}.deb"
          ls -l out

      # Developer-ID sign + notarize the macOS binaries BEFORE the ed25519 step,
      # so the self-update signature is computed over the FINAL (Apple-signed)
      # bytes and still verifies. No-op unless the signing secrets are present, so
      # a build without them still succeeds (unsigned, exactly as before). To turn
      # it on, add these repo secrets: MACOS_CERT_P12_BASE64 (base64 of the
      # Developer ID Application .p12), MACOS_CERT_PASSWORD, MACOS_NOTARY_KEY_BASE64
      # (base64 of the App Store Connect API .p8), MACOS_NOTARY_KEY_ID,
      # MACOS_NOTARY_ISSUER_ID, and optionally MACOS_SIGN_IDENTITY.
      - name: Sign + notarize (macOS Developer ID)
        if: startsWith(matrix.os, 'macos') && startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_NOTARY_KEY_BASE64" ]; then
            echo "::warning::macOS signing secrets not set — publishing UNSIGNED mac binaries (Gatekeeper will not trust them)."
            exit 0
          fi
          IDENTITY="${MACOS_SIGN_IDENTITY:-Developer ID Application: Itay Glick (DA4PX65QXV)}"
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          for b in out/it-ai-macos out/itai-macos out/it-ai-mcp-macos; do
            [ -f "$b" ] || continue
            codesign --force --timestamp --options runtime --sign "$IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
          # Notarize (bare CLI binaries can't be stapled — the ticket is checked
          # online; zip is only the upload transport).
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          ( cd out && zip -q mac-notarize.zip it-ai-macos itai-macos it-ai-mcp-macos )
          xcrun notarytool submit out/mac-notarize.zip \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
          rm -f out/mac-notarize.zip "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

      # Detached ed25519 signatures for the verified self-update path: the agent
      # only self-replaces with a binary whose <asset>.sig verifies against the
      # public key pinned in crates/agent/src/http.rs (UPDATE_PUBKEY). The private
      # half lives ONLY as the UPDATE_SIGNING_KEY repo secret. Fails the build if the
      # secret is missing — we never publish an unsigned release (agents would reject
      # it anyway). Rotate the key: re-run scripts + update UPDATE_PUBKEY + secret.
      - name: Sign binaries (ed25519 detached)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::UPDATE_SIGNING_KEY secret is not set — refusing to publish an unsigned release (self-update would reject it). Add the ed25519 private key as the UPDATE_SIGNING_KEY secret."
            exit 1
          fi
          printf '%s' "$UPDATE_SIGNING_KEY" > update_key.pem
          for f in out/*; do
            [ -f "$f" ] || continue
            case "$f" in *.sig) continue;; esac
            openssl pkeyutl -sign -inkey update_key.pem -rawin -in "$f" -out "$f.sig"
          done
          rm -f update_key.pem
          ls -l out

      # Signed provenance ties each binary to the exact repo+commit+workflow that
      # built it — the public answer to "who is behind this tool". Verify:
      #   gh attestation verify <file> --repo gitayg/haive-agent
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: it-ai-${{ matrix.suffix }}
          path: out/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: out/*

  # One SHA256SUMS covering every released binary, so installs can verify
  # integrity (the MCP install command checks this before chmod +x).
  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Generate SHA256SUMS
        run: |
          : > SHA256SUMS
          find dl -type f | while read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> SHA256SUMS
          done
          sort -k2 -o SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS
