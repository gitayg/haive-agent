# IT-AI.app for macOS on Codemagic, the way O-LINK builds its iPhone app there: a GitHub release of a v* tag
# (build.yml) starts this workflow through Codemagic's API with that tag, because Codemagic gets no webhook from
# this repo. On a Codemagic Mac it builds the tagged agent into IT-AI.app, signs it with a Developer ID, notarizes
# and staples it, wraps it in IT-AI.dmg (macos/dmg.sh) and uploads IT-AI.dmg and IT-AI-macos.zip to that release.
#
# Started on a branch instead (Codemagic: Start new build), it is a dry run: built, signed, notarized and kept as
# this build's artifacts, nothing uploaded.
#
# Nothing here is secret. The Developer ID key and the Apple and GitHub credentials live in Codemagic only, in the
# haive-agent app's env group "Github":
#   APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_PRIVATE_KEY  an App Store Connect
#     API key, Admin role
#   CERTIFICATE_PRIVATE_KEY  the RSA key the Developer ID Application certificate is created from and matched by
#   GITHUB_TOKEN             fine-grained, gitayg/haive-agent only, Contents: read and write
workflows:
  macos-app:
    name: IT-AI.app → DMG
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - Github
      xcode: latest
    scripts:
      - name: Check the tag and the secrets
        script: |
          set -eu
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY GITHUB_TOKEN; do
            [ -n "${!v:-}" ] || { echo "Add $v to the Codemagic env group Github (see codemagic.yaml)"; exit 1; }
          done
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # A branch build is a dry run: everything is built, signed and notarized, nothing is uploaded.
          if [ -n "${CM_TAG:-}" ]; then
            [ "$CM_TAG" = "v$VERSION" ] || { echo "The tag $CM_TAG is not Cargo.toml's version $VERSION"; exit 1; }
          else
            echo "No tag: dry run of $VERSION (the DMG and zip are this build's artifacts only)"
          fi
      - name: Rust
        script: |
          set -eu
          command -v rustup >/dev/null || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$CM_ENV"
      - name: Developer ID certificate
        script: |
          set -eu
          keychain initialize
          # Which key this is, without showing it: its first line, its line count and the MD5 of its public modulus,
          # the same figure `openssl rsa -in <key> -noout -modulus | openssl md5` gives on the Mac that made it.
          k="$(mktemp)"; printf '%s\n' "$CERTIFICATE_PRIVATE_KEY" > "$k"
          echo "CERTIFICATE_PRIVATE_KEY: $(head -1 "$k"), $(wc -l < "$k" | tr -d ' ') lines, modulus $(openssl rsa -in "$k" -noout -modulus 2>/dev/null | openssl md5)"
          rm -f "$k"
          # Reuse the certificate made from CERTIFICATE_PRIVATE_KEY; create it on the first build.
          certs="$HOME/Library/MobileDevice/Certificates"
          app-store-connect certificates list --type DEVELOPER_ID_APPLICATION --certificate-key @env:CERTIFICATE_PRIVATE_KEY --save || true
          if ! ls "$certs"/*.p12 >/dev/null 2>&1; then
            app-store-connect certificates create --type DEVELOPER_ID_APPLICATION --certificate-key @env:CERTIFICATE_PRIVATE_KEY --save
          fi
          keychain add-certificates
          security find-identity -v -p codesigning | grep "Developer ID Application"
      - name: Build, sign and notarize IT-AI.app and IT-AI.dmg
        script: CI=1 macos/dmg.sh
      - name: Upload to the release
        script: |
          set -eu
          [ -n "${CM_TAG:-}" ] || { echo "No tag: dry run, nothing uploaded"; exit 0; }
          command -v gh >/dev/null || brew install gh
          GH_TOKEN="$GITHUB_TOKEN" gh release upload "$CM_TAG" macos/dist/IT-AI.dmg macos/dist/IT-AI-macos.zip \
            --clobber -R gitayg/haive-agent
    artifacts:
      - macos/dist/IT-AI.dmg
      - macos/dist/IT-AI-macos.zip
